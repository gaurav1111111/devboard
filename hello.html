!DOCTYPE html>
<html lang="en">
	<head>
		  <meta charset="UTF-8">
		    <title>Devboard</title>
		      <style>
    body {
	          margin: 0;
		        font-family: Arial, sans-serif;
			      height: 100vh;
			            display: flex;
				          justify-content: center;
					        align-items: center;
						      background: linear-gradient(135deg, #6a11cb, #2575fc);
						            color: white;
							        }
        .container {
		      text-align: center;
		          }
	    h1 {
		          margin-bottom: 10px;
			      }
	        p {
			      font-size: 1.2em;
			          }
		    .btn {
			          margin-top: 20px;
				        padding: 10px 20px;
					      background: white;
					            color: #6a11cb;
						          border: none;
							        border-radius: 5px;
								      cursor: pointer;
								            font-weight: bold;
									        }
		        .btn:hover {
				      background: #f0f0f0;
				          }
			  </style>
	</head>
	<body>
		  <div class="container">
			      <h1>Devboard</h1>
			          <p>Task Tracking for Developers</p>
				      <button class="btn">Get Started</button>
				        </div>
	</body>
</html>
